---
- name: "Phase 1 - OS Hardening & System Prerequisites"
  hosts: mongodb_cluster
  become: true
  tasks:
    - name: Install required OS packages & time synchronization
      ansible.builtin.apt:
        name: [curl, gnupg, ca-certificates, chrony, ufw, iptables, tar, gzip, python3]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure Chrony time sync is active
      ansible.builtin.systemd:
        name: chrony
        state: started
        enabled: true

    - name: Apply MongoDB Kernel Sysctl Tuning
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-mongodb.conf
        mode: '0644'
        content: |
          vm.swappiness = 1
          vm.max_map_count = 1048576
          net.core.somaxconn = 65535
          net.ipv4.tcp_max_syn_backlog = 65535
          fs.file-max = 2097152
      notify: Reload Sysctl

    - name: Set OS Process Limits for MongoDB
      ansible.builtin.copy:
        dest: /etc/security/limits.d/99-mongodb.conf
        mode: '0644'
        content: |
          mongodb soft nofile 100000
          mongodb hard nofile 100000
          mongodb soft nproc 64000
          mongodb hard nproc 64000

    - name: Disable Transparent Huge Pages (THP) via systemd
      ansible.builtin.copy:
        dest: /etc/systemd/system/disable-thp.service
        mode: '0644'
        content: |
          [Unit]
          Description=Disable Transparent Huge Pages (THP)
          Before=mongod.service
          [Service]
          Type=oneshot
          ExecStart=/bin/sh -c 'echo never > /sys/kernel/mm/transparent_hugepage/enabled && echo never > /sys/kernel/mm/transparent_hugepage/defrag'
          [Install]
          WantedBy=basic.target

    - name: Enable and run disable-thp service
      ansible.builtin.systemd:
        name: disable-thp.service
        daemon_reload: true
        state: started
        enabled: true

  handlers:
    - name: Reload Sysctl
      ansible.builtin.command: sysctl --system
