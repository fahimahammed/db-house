---
# ==============================================================================
# Playbook 13: Automated PMM Server Deployment on Monitoring Server
# Installs Docker, Docker Compose Plugin, and launches Percona PMM Server
# ==============================================================================

- name: "Phase 13 - Deploy Percona PMM Server via Docker"
  hosts: monitoring_server
  become: true
  vars_files:
    - ../inventory/group_vars/all.yml

  tasks:
    - name: 13.1 Install Docker prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - ufw
        state: present
        update_cache: true

    - name: 13.2 Create Docker GPG key directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: 13.3 Add Docker official GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: 13.4 Add Docker repository to APT sources
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: 13.5 Install Docker CE and Docker Compose Plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: 13.6 Ensure Docker service is running
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: 13.7 Allow HTTP & HTTPS ports on UFW
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "80"
        - "443"

    - name: 13.8 Allow internal VPC subnet traffic on UFW
      community.general.ufw:
        rule: allow
        from_ip: "10.0.0.0/16"
        comment: "Allow internal VPC traffic"

    - name: 13.9 Create PMM deployment directory on monitoring server
      ansible.builtin.file:
        path: /opt/monitoring-stack
        state: directory
        mode: '0755'

    - name: 13.9 Copy docker-compose.yml to monitoring server
      ansible.builtin.copy:
        src: ../monitoring-stack/docker-compose.yml
        dest: /opt/monitoring-stack/docker-compose.yml
        mode: '0644'

    - name: 13.10 Launch Percona PMM Server using Docker Compose
      ansible.builtin.command: docker compose up -d
      args:
        chdir: /opt/monitoring-stack
      register: pmm_launch_out
      changed_when: "'Started' in pmm_launch_out.stdout or 'Recreated' in pmm_launch_out.stdout"

    - name: 13.11 Wait for PMM Server container services to fully initialize
      ansible.builtin.command: docker exec -t pmm-server supervisorctl status
      register: supervisor_status
      until: "'grafana' in supervisor_status.stdout and 'RUNNING' in supervisor_status.stdout"
      retries: 20
      delay: 5
      failed_when: false
      changed_when: false

    - name: 13.12 Enforce PMM Admin Password via change-admin-password
      ansible.builtin.command: >
        docker exec -t pmm-server change-admin-password "{{ pmm_admin_password }}"
      register: pw_change_out
      changed_when: true

    - name: 13.13 Display PMM Server Access URL
      ansible.builtin.debug:
        msg:
          - "🎉 Percona PMM Server is running and ready!"
          - "Web UI URL: https://{{ ansible_host | default(inventory_hostname) }}"
          - "Admin User: {{ pmm_admin_user }}"
          - "Admin Password: {{ pmm_admin_password }}"

