---
- name: "Phase 6 - Setup Automated Backups on Secondary Node"
  hosts: "{{ backup_target_node | default(groups['mongodb_secondary'][0] | default(groups['mongodb_primary'][0])) }}"
  become: true
  tasks:
    - name: Ensure backup directories exist
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
        state: directory
      loop:
        - { path: "{{ backup_dir }}", owner: root, group: root, mode: '0700' }
        - { path: "{{ backup_log_file | dirname }}", owner: mongodb, group: mongodb, mode: '0755' }

    - name: Deploy backup script & systemd unit files
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - { src: mongodb_backup.sh.j2, dest: /usr/local/bin/mongodb_backup.sh, mode: '0750' }
        - { src: mongodb-backup.service.j2, dest: /etc/systemd/system/mongodb-backup.service, mode: '0644' }
        - { src: mongodb-backup.timer.j2, dest: /etc/systemd/system/mongodb-backup.timer, mode: '0644' }

    - name: Enable and start automated backup timer
      ansible.builtin.systemd:
        name: mongodb-backup.timer
        daemon_reload: true
        state: started
        enabled: true

    - name: Verify backup timer
      ansible.builtin.command: systemctl is-active mongodb-backup.timer
      register: timer_active
      changed_when: false

    - name: Backup Confirmation
      ansible.builtin.debug:
        msg: "✅ Automated backup timer is ACTIVE on {{ inventory_hostname }} (Schedule: {{ backup_systemd_schedule }})"
