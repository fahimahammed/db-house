---
# ==============================================================================
# Global Cluster Configuration Variables - MongoDB Enterprise Cluster
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. MongoDB Engine & Replica Set Versioning
# ------------------------------------------------------------------------------
mongo_version: "7.0"
mongo_replset_name: "rs-prod-01"

# Target version for rolling zero-downtime upgrades
target_upgrade_version: "8.0"
target_feature_compatibility_version: "8.0"

# ------------------------------------------------------------------------------
# 2. Network & Binding
# ------------------------------------------------------------------------------
mongo_port: 27017
# When using firewall-based server allowlisting, binding to 0.0.0.0 is standard
# and secure because UFW drops all traffic except from allowed application servers
# and cluster peer nodes.
mongo_bind_ip: "0.0.0.0"

# ------------------------------------------------------------------------------
# 3. Application Server Binding & Firewall Access Restriction (NEW)
# ------------------------------------------------------------------------------
# Set to true to enforce network-level binding to specific application servers.
# ONLY the IPs/CIDRs listed here AND the cluster peer nodes can access port 27017.
# All other servers / external IPs will be completely blocked.
firewall_access_control_enabled: true
firewall_allow_ssh: true
ssh_port: 22

# List of application servers allowed to access MongoDB (supports single IPs & CIDRs)
mongo_allowed_app_clients:
  - "103.76.154.0/24"  # Local Client Subnet (handles ISP dynamic IP pool)

# ------------------------------------------------------------------------------
# 4. Storage & WiredTiger Tuning
# ------------------------------------------------------------------------------
mongo_data_dir: "/var/lib/mongodb"
mongo_log_dir: "/var/log/mongodb"
mongo_conf_path: "/etc/mongod.conf"
mongo_keyfile_dir: "/etc/mongodb"
mongo_keyfile_path: "/etc/mongodb/mongo-keyfile"

# WiredTiger Engine Tuning (GB)
mongo_wiredtiger_cache_gb: 1

# Oplog Size in Megabytes (5120 MB = 5 GB; in large prod use 50000+)
mongo_oplog_size_mb: 5120

# ------------------------------------------------------------------------------
# 5. Security & Authentication Credentials (RBAC)
# ------------------------------------------------------------------------------
mongo_auth_enabled: true
mongo_admin_user: "clusterAdmin"
mongo_admin_password: "ClusterAdminSecret2026!"
mongo_app_user: "appUser"
mongo_app_password: "AppUserSecret2026!"
mongo_app_db: "ecommerce_db"

# Local keyfile storage path on Ansible Controller (for cluster sync)
local_keyfile_path: "{{ playbook_dir }}/../security/mongo-keyfile"

# ------------------------------------------------------------------------------
# 6. Automated & Manual Backup Configuration (NEW)
# ------------------------------------------------------------------------------
backup_enabled: true
# Designate a Secondary node to take backups (zero impact on Primary write I/O)
backup_target_node: "mongo-02"
backup_dir: "/var/backups/mongodb"
backup_log_file: "/var/log/mongodb/backup.log"
backup_retention_days: 7
# Systemd OnCalendar schedule format: daily at 02:00:00 UTC
backup_systemd_schedule: "*-*-* 02:00:00"
# Equivalent cron schedule: 2 AM every day
backup_cron_schedule: "0 2 * * *"
backup_compression: "gzip"

# ------------------------------------------------------------------------------
# 7. Disaster Recovery & PITR Configuration (NEW)
# ------------------------------------------------------------------------------
dr_restore_temp_dir: "/tmp/mongo_restore"

# ------------------------------------------------------------------------------
# 8. Database Profiling Configuration
# ------------------------------------------------------------------------------
mongo_profiling_mode: "slowOp"
mongo_profiling_slow_ms: 100       # Capture operations taking longer than 100ms
mongo_profiling_sample_rate: 1.0   # 1.0 = 100% of slow operations
mongo_profiling_capped_size_mb: 50 # 50 MB capped system.profile collection

# ------------------------------------------------------------------------------
# 9. Percona PMM (Monitoring and Management) Configuration
# ------------------------------------------------------------------------------
pmm_enabled: true
# Private IP of the dedicated PMM Server (10.0.4.105 inside VPC)
pmm_server_host: "10.0.4.105"
pmm_server_port: 443
pmm_server_insecure_tls: true

# PMM Server Web / API credentials
pmm_admin_user: "admin"
pmm_admin_password: "PmmAdmin2026"

# MongoDB Monitoring user credentials (managed by PMM Client)
pmm_mongo_user: "pmm_user"
pmm_mongo_password: "PmmSecurePassword2026"
pmm_environment: "production"

