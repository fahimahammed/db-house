---
- name: "Reconfigure Replica Set Members with Public IPs"
  hosts: mongodb_primary
  become: true
  tasks:
    - name: Update Replica Set configuration directly with Public IPs
      ansible.builtin.shell: >
        mongosh --port {{ mongo_port }} admin -u "{{ mongo_admin_user }}" -p "{{ mongo_admin_password }}" --quiet --eval '
          let cfg = rs.conf();
          cfg.members.forEach(m => {
            if (m._id === 0) m.host = "{{ hostvars["mongo-01"].ansible_host }}:{{ mongo_port }}";
            if (m._id === 1) m.host = "{{ hostvars["mongo-02"].ansible_host }}:{{ mongo_port }}";
            if (m._id === 2) m.host = "{{ hostvars["mongo-03"].ansible_host }}:{{ mongo_port }}";
          });
          rs.reconfig(cfg, { force: true });
        '
      register: reconfig_res
      changed_when: true

    - name: Pause 5 seconds for reconfig propagation
      ansible.builtin.pause:
        seconds: 5

    - name: Verify Cluster Status
      ansible.builtin.shell: >
        mongosh --port {{ mongo_port }} admin -u "{{ mongo_admin_user }}" -p "{{ mongo_admin_password }}" --quiet --eval '
          rs.status().members.map(m => m.name + " (" + m.stateStr + ")")
        '
      register: final_members

    - name: Print New Replica Set Members with Public IPs
      ansible.builtin.debug:
        msg: "{{ final_members.stdout_lines }}"

