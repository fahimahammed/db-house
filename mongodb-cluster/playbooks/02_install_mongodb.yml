---
- name: "Phase 2 - Install Specific MongoDB Version"
  hosts: mongodb_cluster
  become: "{{ ansible_user | default('ubuntu') != 'root' }}"
  tasks:
    - name: Create directory for apt keyrings
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download MongoDB GPG public key
      ansible.builtin.get_url:
        url: "https://www.mongodb.org/static/pgp/server-{{ mongo_version }}.asc"
        dest: "/tmp/mongodb-{{ mongo_version }}.asc"
        mode: '0644'

    - name: De-armor MongoDB GPG key into keyrings directory
      ansible.builtin.shell: >
        cat /tmp/mongodb-{{ mongo_version }}.asc | gpg --dearmor --yes -o /etc/apt/keyrings/mongodb-server-{{ mongo_version }}.gpg
      changed_when: false

    - name: Determine apt repo distribution codename
      ansible.builtin.set_fact:
        mongo_repo_codename: "{{ ansible_distribution_release if ansible_distribution_release in ['jammy', 'focal'] else 'jammy' }}"

    - name: Clean up any previous invalid mongodb repository list
      ansible.builtin.file:
        path: "/etc/apt/sources.list.d/mongodb-org-{{ mongo_version }}.list"
        state: absent

    - name: Add official MongoDB apt repository
      ansible.builtin.apt_repository:
        repo: "deb [ arch=amd64,arm64 signed-by=/etc/apt/keyrings/mongodb-server-{{ mongo_version }}.gpg ] https://repo.mongodb.org/apt/ubuntu {{ mongo_repo_codename }}/mongodb-org/{{ mongo_version }} multiverse"
        state: present
        filename: "mongodb-org-{{ mongo_version }}"
        update_cache: true

    - name: Install MongoDB packages ({{ mongo_version }})
      ansible.builtin.apt:
        name:
          - mongodb-org
          - mongodb-org-server
          - mongodb-org-mongos
          - mongodb-org-tools
          - mongodb-mongosh
        state: present

    - name: Pin MongoDB packages to prevent accidental auto-upgrade
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - mongodb-org
        - mongodb-org-server
        - mongodb-org-mongos
        - mongodb-org-tools
        - mongodb-mongosh

    - name: Ensure MongoDB data and log directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: mongodb
        group: mongodb
        mode: '0750'
      loop:
        - "{{ mongo_data_dir }}"
        - "{{ mongo_log_dir }}"

    - name: Ensure mongod service is enabled on boot
      ansible.builtin.systemd:
        name: mongod
        enabled: true
