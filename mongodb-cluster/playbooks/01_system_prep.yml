---
- name: "Phase 1 - OS Hardening, Kernel Tuning & System Prerequisites"
  hosts: mongodb_cluster
  become: "{{ ansible_user | default('ubuntu') != 'root' }}"
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install fundamental OS packages & time synchronization
      ansible.builtin.apt:
        name:
          - curl
          - gnupg
          - ca-certificates
          - lsb-release
          - chrony
          - python3
          - python3-pip
          - procps
        state: present

    - name: Ensure Chrony time synchronization is running (critical for Oplog ordering)
      ansible.builtin.systemd:
        name: chrony
        state: started
        enabled: true

    - name: Apply MongoDB Kernel Sysctl Parameters (/etc/sysctl.d/99-mongodb.conf)
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-mongodb.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          # Virtual Memory Optimization
          vm.swappiness = 1
          vm.dirty_ratio = 15
          vm.dirty_background_ratio = 5
          vm.max_map_count = 1048576

          # Network Tuning for High-Concurrency MongoDB Traffic
          net.core.somaxconn = 65535
          net.ipv4.tcp_max_syn_backlog = 65535
          net.ipv4.tcp_fin_timeout = 15
          net.ipv4.tcp_keepalive_time = 300
          net.ipv4.tcp_keepalive_intvl = 60
          net.ipv4.tcp_keepalive_probes = 5
          net.ipv4.tcp_tw_reuse = 1

          # File Descriptor Capacity
          fs.file-max = 2097152

    - name: Reload sysctl configurations
      ansible.builtin.command: sysctl --system
      changed_when: false

    - name: Set OS Process Limits for MongoDB (/etc/security/limits.d/99-mongodb.conf)
      ansible.builtin.copy:
        dest: /etc/security/limits.d/99-mongodb.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          mongodb soft nofile 100000
          mongodb hard nofile 100000
          mongodb soft nproc 64000
          mongodb hard nproc 64000
          mongodb soft memlock unlimited
          mongodb hard memlock unlimited
          root soft nofile 100000
          root hard nofile 100000

    - name: Create Systemd service to disable Transparent Huge Pages (THP)
      ansible.builtin.copy:
        dest: /etc/systemd/system/disable-thp.service
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Disable Transparent Huge Pages (THP) for MongoDB
          DefaultDependencies=no
          After=sysinit.target local-fs.target
          Before=mongod.service

          [Service]
          Type=oneshot
          ExecStart=/bin/sh -c 'echo never > /sys/kernel/mm/transparent_hugepage/enabled && echo never > /sys/kernel/mm/transparent_hugepage/defrag'

          [Install]
          WantedBy=basic.target

    - name: Reload systemd daemon & enable disable-thp.service
      ansible.builtin.systemd:
        name: disable-thp.service
        daemon_reload: true
        state: started
        enabled: true

