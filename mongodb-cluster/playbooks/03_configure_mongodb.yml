---
- name: "Phase 3.1 - Generate Shared Cluster Keyfile on Controller"
  hosts: localhost
  connection: local
  tasks:
    - name: Ensure security directory exists on Ansible controller
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../security"
        state: directory
        mode: '0700'

    - name: Check if keyfile already exists
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../security/mongo-keyfile"
      register: keyfile_stat

    - name: Generate high-entropy 1024-byte keyfile if not present
      ansible.builtin.shell: "openssl rand -base64 756 > {{ playbook_dir }}/../security/mongo-keyfile"
      when: not keyfile_stat.stat.exists

    - name: Set secure permissions on local keyfile
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../security/mongo-keyfile"
        mode: '0400'

- name: "Phase 3.2 - Configure MongoDB & Distribute Keyfile to All Nodes"
  hosts: mongodb_cluster
  become: "{{ ansible_user | default('ubuntu') != 'root' }}"
  tasks:
    - name: Ensure MongoDB configuration & keyfile directory exists
      ansible.builtin.file:
        path: "{{ mongo_keyfile_dir }}"
        state: directory
        owner: mongodb
        group: mongodb
        mode: '0700'

    - name: Distribute cluster keyfile to all VPS nodes
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../security/mongo-keyfile"
        dest: "{{ mongo_keyfile_path }}"
        owner: mongodb
        group: mongodb
        mode: '0400'

    - name: Deploy tuned mongod.conf configuration
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/mongod.conf.j2"
        dest: "{{ mongo_conf_path }}"
        owner: root
        group: root
        mode: '0644'
      notify: Restart mongod

    - name: Ensure mongod service is started and enabled
      ansible.builtin.systemd:
        name: mongod
        state: started
        enabled: true

    - name: Wait for MongoDB port {{ mongo_port }} to become available
      ansible.builtin.wait_for:
        port: "{{ mongo_port }}"
        host: "127.0.0.1"
        timeout: 60

  handlers:
    - name: Restart mongod
      ansible.builtin.systemd:
        name: mongod
        state: restarted

