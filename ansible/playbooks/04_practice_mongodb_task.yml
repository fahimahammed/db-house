---
# ==============================================================================
# Playbook 4: Hands-On MongoDB Cluster Simulation Lab
# Simulates full MongoDB production node preparation locally without affecting OS
# Command to run: ansible-playbook playbooks/04_practice_mongodb_task.yml
# ==============================================================================
- name: Practical MongoDB Node Preparation Lab
  hosts: local
  gather_facts: false

  vars:
    mongo_version: "7.0"
    mongo_port: 27017
    mongo_bind_ip: "0.0.0.0"
    replica_set_name: "rs-prod-01"
    wiredtiger_cache_gb: 16
    mongo_db_path: "/tmp/db_house_lab/mongo_data"
    mongo_log_path: "/tmp/db_house_lab/mongo_logs"
    mongo_keyfile_path: "/tmp/db_house_lab/mongo_security/mongo-keyfile"

  tasks:
    - name: Step 1 - Ensure required MongoDB directories exist with restricted permissions
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0700'
      loop:
        - "{{ mongo_db_path }}"
        - "{{ mongo_log_path }}"
        - "/tmp/db_house_lab/mongo_security"

    - name: Step 2 - Deploy high-entropy cluster keyfile for internal authentication
      ansible.builtin.copy:
        content: "c3VwZXJfc2VjcmV0X21vbmdvX2tleWZpbGVfZm9yX3Byb2R1Y3Rpb25fcmVwbGljYXNldF8xMDI0X2JpdHM="
        dest: "{{ mongo_keyfile_path }}"
        mode: '0400'  # Strict requirement for MongoDB keyfile security

    - name: Step 3 - Render production mongod.conf configuration file
      ansible.builtin.template:
        src: templates/mock_mongod.conf.j2
        dest: /tmp/db_house_lab/mongod.conf
        mode: '0644'

    - name: Step 4 - Validate and display MongoDB node preparation summary
      ansible.builtin.debug:
        msg:
          - "MongoDB Version: {{ mongo_version }}"
          - "Data Path: {{ mongo_db_path }}"
          - "Security Keyfile: {{ mongo_keyfile_path }} (chmod 400 verified)"
          - "Replica Set Name: {{ replica_set_name }}"
          - "Production mongod.conf deployed successfully!"
