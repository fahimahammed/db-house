# -------------------------------------------------------------
# Ansible Inventory Configuration
# -------------------------------------------------------------

# 1. Local execution group (for local practice without remote servers):
[local]
localhost ansible_connection=local

# 2. Production / Staging MongoDB cluster nodes (for remote execution):
[mongodb_cluster]
# mongo-01 ansible_host=10.0.10.11 ansible_user=ubuntu mongo_role=primary
# mongo-02 ansible_host=10.0.10.12 ansible_user=ubuntu mongo_role=secondary
# mongo-03 ansible_host=10.0.10.13 ansible_user=ubuntu mongo_role=secondary

[mongodb_cluster:vars]
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
mongo_port=27017
